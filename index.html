<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Aula: Parâmetros via GET</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h1>📋 Formulário com GET</h1>

        <!-- action aponta para o arquivo que vai PROCESSAR -->
        <form method="get" action="processa.php">
            <input type="text" name="nome" placeholder="Seu nome"><br>
            <input type="number" name="idade" placeholder="Sua idade"><br>
            <input type="text" name="curso" placeholder="Seu curso"><br>
            <input type="text" name="email" placeholder="Seu email"><br>
            <input type="text" name="escola" placeholder="Sua escola"><br>
            <button type="submit">Enviar</button>
        </form>
    </div>
    <footer><h3>Desenvolvido por Beatriz V. e Victor Gabriel</h3></footer>
</body>
</html>
